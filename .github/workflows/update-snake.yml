name: Atualizar Snake de commits

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar Pillow
        run: python -m pip install pillow

      - name: Gerar animação com commits públicos
        env:
          GITHUB_USERNAME: Wiik12223
        run: python scripts/update_snake.py

      - name: Publicar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-commits.gif
          git diff --cached --quiet || git commit -m "chore: atualizar snake de commits"
          git push
